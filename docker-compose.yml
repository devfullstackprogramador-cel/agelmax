services:
  db:
    image: postgres:16-alpine
    container_name: agelmax-padaria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agelmax_padaria
      POSTGRES_USER: agelmax
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - agelmax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agelmax -d agelmax_padaria"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agelmax_pgdata:
